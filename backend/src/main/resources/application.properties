# Server Settings
server.port=8080
server.servlet.context-path=/

# Database Configuration (Auto-detects H2 or PostgreSQL based on JDBC URL)
spring.datasource.url=jdbc:h2:mem:spendwisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA & Hibernate Settings (Auto-detects Dialect based on database connection)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.spendwise.tracker=DEBUG
logging.level.org.springframework.web=INFO
